<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Elektronika - Ohm's Law</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <h3>Instruksi:</h3>
        <p>Pasang <b>Resistor</b> dan <b>LED</b> ke papan sirkuit. Atur Voltase baterai dan nilai hambatan.</p>
        <hr>
        <div class="status-box" id="msg">Lengkapi komponen...</div>
    </div>

    <div class="main-canvas">
        <div class="circuit-wrapper">
            <svg class="circuit-svg" width="400" height="250" viewBox="0 0 400 250">
                <path d="M 80 125 L 80 50 L 320 50 L 320 200 L 80 200 L 80 175" fill="none" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
                
                <g id="battery-fixed">
                    <rect x="60" y="125" width="40" height="50" rx="3" fill="#34495e" />
                    <rect x="70" y="118" width="20" height="7" fill="#f1c40f" />
                    <text x="73" y="155" fill="white" font-weight="bold" font-size="14">V</text>
                    <circle cx="80" cy="125" r="4" fill="#2ecc71" />
                    <circle cx="80" cy="175" r="4" fill="#2ecc71" />
                </g>
            </svg>

            <div class="drop-zone" id="slot-resistor" data-type="resistor" style="top: 30px; left: 160px;">+ Resistor</div>
            <div class="drop-zone" id="slot-led" data-type="led" style="top: 100px; left: 300px;">+ LED</div>
        </div>

        <div class="controls-panel">
            <div class="input-group">
                <label>Baterai (Volt):</label>
                <input type="number" id="v-input" value="9">
            </div>
            <div class="input-group">
                <label>Resistor (Ω):</label>
                <input type="number" id="r-input" value="100">
            </div>
            <button id="btn-run">Jalankan Arus</button>
        </div>
    </div>

    <div class="shelf">
        <h4>Komponen</h4>
        
        <div class="draggable" draggable="true" id="drag-led" data-type="led">
            <svg width="40" height="60" viewBox="0 0 40 60">
                <path d="M10,30 Q10,5 20,5 Q30,5 30,30 L30,40 L10,40 Z" fill="#95a5a6" class="led-bulb"/>
                <rect x="14" y="40" width="3" height="20" fill="#bdc3c7" />
                <rect x="23" y="40" width="3" height="20" fill="#bdc3c7" />
            </svg>
            <small>LED</small>
        </div>

        <div class="draggable" draggable="true" id="drag-resistor" data-type="resistor">
            <svg width="80" height="30" viewBox="0 0 80 30">
                <rect x="0" y="12" width="80" height="6" fill="#bdc3c7" /> <rect x="15" y="5" width="50" height="20" rx="8" fill="#d2b48c" /> <rect x="25" y="5" width="5" height="20" fill="#8b4513" /> <rect x="35" y="5" width="5" height="20" fill="#000" /> <rect x="45" y="5" width="5" height="20" fill="#f00" /> </svg>
            <small>Resistor</small>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
