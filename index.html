<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Ohm's Law Simulator - Fixed Rotation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="side-panel">
        <div class="card">
          <h4>Instruksi:</h4>
          <p>Lengkapi sirkuit dan klik <b>Generate</b>. Target arus: 200 mA.</p>
          <h4>Keterangan:</h4>
          <div class="legend-list">
            <div class="legend-item">
              <span class="dot low"></span> Low (< 50mA)
            </div>
            <div class="legend-item">
              <span class="dot med"></span> Medium (50-150mA)
            </div>
            <div class="legend-item">
              <span class="dot high"></span> Perfect (150-200mA)
            </div>
            <div class="legend-item">
              <span class="dot over"></span> Burnout (> 200mA)
            </div>
          </div>

          <div class="result-display">
            <p>Arus :</p>
            <h2><span id="i-display">0.00</span> mA</h2>
          </div>
        </div>
      </div>

      <div class="center-panel">
        <div class="circuit-container">
          <svg viewBox="0 0 400 300" class="circuit-svg">
            <path
              d="M 100 200 L 100 50 L 160 50 M 240 50 L 300 50 L 300 135 M 300 165 L 300 250 L 100 250 L 100 200"
              fill="none"
              stroke="#333"
              stroke-width="3"
            />

            <g transform="translate(85, 170)">
              <rect
                x="0"
                y="-30"
                width="30"
                height="40"
                fill="#2c3e50"
                rx="2"
              />
              <rect x="5" y="-35" width="20" height="5" fill="#f1c40f" />
              <text
                x="10"
                y="-10"
                fill="white"
                font-size="12"
                font-weight="bold"
              >
                V
              </text>
            </g>

            
          </svg>

          <div
            class="drop-zone"
            id="slot-resistor"
            data-type="resistor"
            style="top: 50px; left: 200px"
          ></div>
          <div
            class="drop-zone rotated-led"
            id="slot-led"
            data-type="led"
            style="top: 150px; left: 325px"
          ></div>
        </div>

        <div class="input-card">
          <h4>Variabel</h4>
          <div class="inputs-wrapper">
            <div class="input-group">
              <label for="v-input">Tegangan Baterai (V)</label>
              <input type="number" id="v-input" value="12" />
            </div>
            <div class="input-group">
              <label for="r-input">Resistansi (Ω)</label>
              <input type="number" id="r-input" value="100" />
            </div>
          </div>
          <button id="btn-generate">Generate</button>
        </div>
      </div>

      <div class="side-panel">
        <div class="card">
          <h4>Components:</h4>
          <div class="shelf">
            <div class="component-item">
              <span class="comp-name">Resistor</span>
              <div
                class="draggable"
                draggable="true"
                id="drag-resistor"
                data-type="resistor"
              >
                <svg width="80" height="30" viewBox="0 0 80 30">
                  <line
                    x1="0"
                    y1="15"
                    x2="80"
                    y2="15"
                    stroke="#333"
                    stroke-width="3"
                  />
                  <rect
                    x="15"
                    y="5"
                    width="50"
                    height="20"
                    rx="10"
                    fill="#00FFFF"
                    stroke="#333"
                  />
                  <rect x="25" y="5" width="4" height="20" fill="#000" />
                  <rect x="33" y="5" width="4" height="20" fill="#000" />
                  <rect x="41" y="5" width="4" height="20" fill="#000" />
                  <rect x="50" y="5" width="4" height="20" fill="#000" />
                </svg>
              </div>
            </div>

            <div class="component-item">
              <span class="comp-name">Battery</span>
              <div
                class="draggable"
                draggable="true"
                id="drag-battery"
                data-type="battery"
              >
                <svg width="40" height="60" viewBox="0 0 40 60">
                  <rect
                    x="5"
                    y="10"
                    width="30"
                    height="45"
                    rx="2"
                    fill="#2c3e50"
                    stroke="#333"
                    stroke-width="2"
                  />
                  <rect
                    x="12"
                    y="5"
                    width="16"
                    height="5"
                    fill="#f1c40f"
                    stroke="#333"
                    stroke-width="1"
                  />
                  <text
                    x="11"
                    y="40"
                    fill="white"
                    font-size="10"
                    font-weight="bold"
                  >
                    BAT
                  </text>
                </svg>
              </div>
            </div>

            <div class="component-item">
              <span class="comp-name">LED Light</span>
              <div
                class="draggable"
                draggable="true"
                id="drag-led"
                data-type="led"
              >
                <svg width="40" height="60" viewBox="0 0 40 60">
                  <line
                    x1="6"
                    y1="35"
                    x2="6"
                    y2="56"
                    stroke="#333"
                    stroke-width="3"
                  />
                  <line
                    x1="34"
                    y1="35"
                    x2="34"
                    y2="56"
                    stroke="#333"
                    stroke-width="3"
                  />
                  <path
                    d="M5,35 L35,35 L35,20 Q35,0 20,0 Q5,0 5,20 Z"
                    fill="#FFFFFF"
                    stroke="#333"
                    class="led-bulb"
                  />
                </svg>
              </div>
            </div>
            <div class="component-item">
              <span class="comp-name">Wire</span>
              <div
                class="draggable"
                draggable="true"
                id="drag-wire"
                data-type="wire"
              >
                <svg width="80" height="30" viewBox="0 0 80 30">
                  <line
                    x1="0"
                    y1="15"
                    x2="80"
                    y2="15"
                    stroke="#333"
                    stroke-width="4"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
            </div>
            <div class="component-item">
              <span class="comp-name">Capasitor</span>
              <div
                class="draggable"
                draggable="true"
                id="drag-capacitor"
                data-type="capacitor"
              >
                <svg width="40" height="60" viewBox="0 0 40 60">
                  <line
                    x1="14"
                    y1="45"
                    x2="14"
                    y2="60"
                    stroke="#333"
                    stroke-width="2.5"
                  />
                  <line
                    x1="26"
                    y1="45"
                    x2="26"
                    y2="60"
                    stroke="#333"
                    stroke-width="2.5"
                  />

                  <rect
                    x="8"
                    y="5"
                    width="24"
                    height="40"
                    rx="3"
                    fill="#34495e"
                    stroke="#333"
                    stroke-width="1.5"
                  />

                  <rect
                    x="22"
                    y="5"
                    width="10"
                    height="40"
                    rx="0"
                    fill="#bdc3c7"
                    opacity="0.8"
                  />
                  <text
                    x="24"
                    y="25"
                    fill="#34495e"
                    font-size="8"
                    font-weight="bold"
                  >
                    -
                  </text>
                  <text
                    x="24"
                    y="15"
                    fill="#34495e"
                    font-size="8"
                    font-weight="bold"
                  >
                    -
                  </text>
                  <text
                    x="24"
                    y="35"
                    fill="#34495e"
                    font-size="8"
                    font-weight="bold"
                  >
                    -
                  </text>

                  <ellipse
                    cx="20"
                    cy="7"
                    rx="12"
                    ry="3"
                    fill="#2c3e50"
                    stroke="#333"
                    stroke-width="1"
                  />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
